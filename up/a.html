<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雲端文本暫存區</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; background: #f9f9f9; color: #333; }
  input, textarea, button { width: 100%; box-sizing: border-box; margin-bottom: 12px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
  textarea { font-size: 22.5px; resize: vertical; }
  button { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
  button:hover { background: #0056b3; }
  .list-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px; margin-bottom: 6px; border: 1px solid #eee; border-radius: 4px; }
  .list-item a { color: #007bff; text-decoration: none; word-break: break-all; margin-right: 10px; }
  .btn-del { width: auto; margin: 0; background: #dc3545; padding: 6px 12px; font-size: 14px; }
  .btn-del:hover { background: #bd2130; }
  .status { font-size: 14px; color: #666; margin-top: -6px; margin-bottom: 12px; text-align: right; }
</style>
</head>
<body>

  <h2>📝 雲端文本暫存區</h2>

  <!-- 輸入框 Z -->
  <input type="password" id="inputZ" placeholder="請輸入token" onchange="initPage()">
  
  <!-- 輸入框 A -->
  <input type="text" id="inputA" value="tmp.txt" placeholder="請輸入檔案名稱">
  
  <!-- 輸入框 B -->
  <textarea id="inputB" rows="6" placeholder="請輸入文本內容（文字大小 22.5px）"></textarea>
  
  <div class="status" id="apiStatus">API 剩餘額度: --</div>
  <button onclick="saveText()">保存文本</button>

  <hr>

  <h3>📁 目錄文檔列表</h3>
  <div id="fileList">請輸入正確的 Token 以載入檔案列表...</div>

<script>
  const OWNER = 'paopaoloung';
  const REPO = 'paopaoloung.github.io';
  const BRANCH = 'main';
  const FOLDER = 'up/files';

  function getToken() {
    return document.getElementById('inputZ').value.trim();
  }

  // 確保此處的網址拼接百分之百正確，絕無 {owner} 等錯誤字眼
  async function apiFetch(method, path, body = null) {
    const token = getToken();
    if (!token) return null;

    const url = `https://github.com{OWNER}/${REPO}/contents/${path}?t=${Date.now()}`;
    const options = {
      method: method,
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      }
    };
    if (body) options.body = JSON.stringify(body);

    const res = await fetch(url, options);
    
    const remaining = res.headers.get('X-RateLimit-Remaining');
    if (remaining !== null) {
      document.getElementById('apiStatus').textContent = `API 剩餘額度: ${remaining}`;
    }

    if (!res.ok && res.status !== 404) {
      const errData = await res.json();
      throw new Error(errData.message || 'API 請求失敗');
    }
    return res;
  }

  function utoa(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function atou(str) {
    return decodeURIComponent(escape(atob(str.replace(/\s/g, ''))));
  }

  async function initPage() {
    const token = getToken();
    if (!token) return;

    try {
      const res = await apiFetch('GET', `${FOLDER}/tmp.txt`);
      if (res && res.status === 200) {
        const data = await res.json();
        document.getElementById('inputB').value = atou(data.content);
      } else {
        document.getElementById('inputB').value = '';
      }
    } catch (e) {
      console.error('讀取預設檔案失敗:', e);
      document.getElementById('inputB').value = '';
    }

    refreshList();
  }

  async function saveText() {
    const filename = document.getElementById('inputA').value.trim();
    const content = document.getElementById('inputB').value;
    if (!filename) return alert('請輸入檔案名稱！');

    const path = `${FOLDER}/${filename}`;
    
    try {
      let sha = null;
      const checkRes = await apiFetch('GET', path);
      if (checkRes && checkRes.status === 200) {
        const data = await checkRes.json();
        sha = data.sha;
      }

      const body = {
        message: `Save text: ${filename}`,
        content: utoa(content),
        branch: BRANCH
      };
      if (sha) body.sha = sha;

      await apiFetch('PUT', path, body);
      alert(`檔案 ${filename} 保存成功！`);

      document.getElementById('inputA').value = 'tmp.txt';
      document.getElementById('inputB').value = '';
      
      refreshList();
    } catch (e) {
      alert('保存失敗: ' + e.message);
    }
  }

  async function refreshList() {
    const container = document.getElementById('fileList');
    try {
      const res = await apiFetch('GET', FOLDER);
      if (!res || res.status === 404) {
        container.innerHTML = '<div>資料夾內尚無檔案</div>';
        return;
      }
      
      const files = await res.json();
      if (!Array.isArray(files) || files.length === 0) {
        container.innerHTML = '<div>資料夾內尚無檔案</div>';
        return;
      }

      container.innerHTML = '';
      const filteredFiles = files.filter(item => item.type === 'file');

      filteredFiles.forEach(file => {
        const div = document.createElement('div');
        div.className = 'list-item';

        const link = document.createElement('a');
        link.href = file.download_url;
        link.target = '_blank';
        link.textContent = file.name;

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-del';
        delBtn.textContent = '刪除';
        delBtn.onclick = async () => {
          if (!confirm(`確定要刪除 ${file.name} 嗎？`)) return;
          try {
            const body = {
              message: `Delete file: ${file.name}`,
              sha: file.sha,
              branch: BRANCH
            };
            await apiFetch('DELETE', file.path, body);
            alert(`${file.name} 刪除成功！`);
            refreshList();
          } catch (e) {
            alert('刪除失敗: ' + e.message);
          }
        };

        div.appendChild(link);
        div.appendChild(delBtn);
        container.appendChild(div);
      });
    } catch (e) {
      container.innerHTML = `<div style="color:red">無法載入列表: ${e.message}</div>`;
    }
  }
</script>
</body>
</html>
