<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雲端暫存文本區</title>

<style>
body{
    font-family:Arial;
    margin:20px;
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
}

textarea{
    width:100%;
    height:300px;
    padding:10px;
}

button{
    padding:8px 15px;
    margin:5px;
    cursor:pointer;
}

.file-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:5px 0;
}

a{
    text-decoration:none;
}
</style>
</head>

<body>

<h2>雲端暫存文本區</h2>

<div>
    GitHub Token
    <input id="tokenInput" type="password">
    <button onclick="saveToken()">保存Token</button>
</div>

<div>
    Repo (格式: username/repo)
    <input id="repoInput" value="paopaoloung/up">
</div>

<div>
    檔案名稱
    <input id="fileName" value="tmp.txt">
</div>

<div>
    <textarea id="content"></textarea>
</div>

<button onclick="saveFile()">保存內容</button>

<hr>

<h3>tmpTxt 檔案清單</h3>

<div id="fileList"></div>

<script>

const tokenInput=document.getElementById("tokenInput");
const repoInput=document.getElementById("repoInput");
const fileNameInput=document.getElementById("fileName");
const contentInput=document.getElementById("content");

window.onload=()=>{
    tokenInput.value=localStorage.getItem("github_token")||"";
    repoInput.value=localStorage.getItem("repo_name")||"";
    loadFileList();
}

function saveToken(){
    localStorage.setItem(
        "github_token",
        tokenInput.value.trim()
    );

    localStorage.setItem(
        "repo_name",
        repoInput.value.trim()
    );

    alert("Token已保存");
}

function getHeaders(){
    return {
        Authorization:`token ${tokenInput.value.trim()}`,
        Accept:'application/vnd.github+json'
    };
}

async function saveFile(){

    const repo=repoInput.value.trim();
    const filename=fileNameInput.value.trim();
    const content=contentInput.value;

    const path=`tmpTxt/${filename}`;

    let sha=null;

    const check=await fetch(
        `https://api.github.com/repos/${repo}/contents/${path}`,
        {
            headers:getHeaders()
        }
    );

    if(check.ok){
        const data=await check.json();
        sha=data.sha;
    }

    const body={
        message:`save ${filename}`,
        content:btoa(
            unescape(
                encodeURIComponent(content)
            )
        )
    };

    if(sha){
        body.sha=sha;
    }

    const res=await fetch(
        `https://api.github.com/repos/${repo}/contents/${path}`,
        {
            method:'PUT',
            headers:{
                ...getHeaders(),
                'Content-Type':'application/json'
            },
            body:JSON.stringify(body)
        }
    );

    if(res.ok){

        fileNameInput.value="tmp.txt";
        contentInput.value="";

        alert("保存成功");

        setTimeout(()=>{
            loadFileList();
        },5000);

    }else{
        const err=await res.text();
        alert(err);
    }
}

async function loadFileList(){

    const repo=repoInput.value.trim();

    if(!repo) return;

    const res=await fetch(
        `https://api.github.com/repos/${repo}/contents/tmpTxt`,
        {
            headers:getHeaders()
        }
    );

    if(!res.ok){
        return;
    }

    const files=await res.json();

    const div=document.getElementById("fileList");

    div.innerHTML="";

    files
    .filter(f=>f.type==="file")
    .sort((a,b)=>a.name.localeCompare(b.name))
    .forEach(file=>{

        const row=document.createElement("div");
        row.className="file-row";

        const link=document.createElement("a");
        link.href="#";
        link.textContent=file.name;

        link.onclick=(e)=>{
            e.preventDefault();
            openFile(file.name);
        };

        const del=document.createElement("button");
        del.innerHTML="刪除";

        del.onclick=()=>{
            deleteFile(file.name);
        };

        row.appendChild(link);
        row.appendChild(del);

        div.appendChild(row);

    });
}

async function openFile(filename){

    const repo=repoInput.value.trim();

    const res=await fetch(
        `https://api.github.com/repos/${repo}/contents/tmpTxt/${filename}`,
        {
            headers:getHeaders()
        }
    );

    const data=await res.json();

    const text=decodeURIComponent(
        escape(
            atob(data.content.replace(/\n/g,''))
        )
    );

    fileNameInput.value=filename;
    contentInput.value=text;
}

async function deleteFile(filename){

    if(!confirm(`刪除 ${filename} ?`)){
        return;
    }

    const repo=repoInput.value.trim();

    const res1=await fetch(
        `https://api.github.com/repos/${repo}/contents/tmpTxt/${filename}`,
        {
            headers:getHeaders()
        }
    );

    const data=await res1.json();

    const res2=await fetch(
        `https://api.github.com/repos/${repo}/contents/tmpTxt/${filename}`,
        {
            method:'DELETE',
            headers:{
                ...getHeaders(),
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                message:`delete ${filename}`,
                sha:data.sha
            })
        }
    );

    if(res2.ok){
        loadFileList();
    }else{
        alert("刪除失敗");
    }
}

</script>

</body>
</html>
