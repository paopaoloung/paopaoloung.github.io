<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端文本暫存區 v5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* 嚴格設定輸入框B的文字大小為 22.5 */
        #inputB {
            font-size: 22.5px;
            height: 150px;
            resize: vertical;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .file-list {
            margin-top: 25px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .file-link {
            color: #007bff;
            text-decoration: none;
            cursor: pointer;
        }
        .file-link:hover {
            text-decoration: underline;
        }
        .delete-btn {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 14px;
        }
        .delete-btn:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

    <h2>📝 雲端文本暫存區 v5</h2>

    <!-- 輸入框 Z -->
    <div class="form-group">
        <label>Token 驗證：</label>
        <input type="text" id="inputZ" value="---請輸入token">
    </div>

    <!-- 輸入框 A -->
    <div class="form-group">
        <label>檔案名稱：</label>
        <input type="text" id="inputA" value="tmp.txt">
    </div>

    <!-- 輸入框 B -->
    <div class="form-group">
        <label>文本內容：</label>
        <textarea id="inputB" placeholder="（讀取後顯示文本內容，若不存在則留空）"></textarea>
    </div>

    <!-- 按鈕保存 -->
    <div class="form-group">
        <button type="button" id="saveBtn">保存文本</button>
    </div>

    <!-- 目錄文檔列表 -->
    <div class="file-list">
        <h3>📁 目錄文檔列表 (List)</h3>
        <div id="listContainer">
            <!-- 動態生成列表項目 -->
        </div>
    </div>

    <script>
        // 初始化預設資料（若模擬資料庫為空，先預設建立三個初始檔案）
        if (!localStorage.getItem('cloud_files')) {
            const defaultFiles = {
                "tmp.txt": "這是 tmp.txt 的預設內容。",
                "tmp1.txt": "這是 tmp1.txt 的隨機文字。",
                "tmp2.txt": "這是 tmp2.txt 的測試範例。"
            };
            localStorage.setItem('cloud_files', JSON.stringify(defaultFiles));
        }

        // 獲取 DOM 元素
        const inputA = document.getElementById('inputA');
        const inputB = document.getElementById('inputB');
        const saveBtn = document.getElementById('saveBtn');
        const listContainer = document.getElementById('listContainer');

        // 讀取所有檔案並渲染清單
        function renderFileList() {
            listContainer.innerHTML = '';
            const files = JSON.parse(localStorage.getItem('cloud_files')) || {};
            
            // 遍歷所有檔案生成超連結與刪除按鈕
            Object.keys(files).forEach(fileName => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'file-item';

                // 超連結：點擊載入檔案內容至 B，名稱載入至 A
                const link = document.createElement('a');
                link.className = 'file-link';
                link.textContent = fileName;
                link.href = '#';
                link.onclick = function(e) {
                    e.preventDefault();
                    inputA.value = fileName;
                    inputB.value = files[fileName] || '';
                };

                // 刪除按鈕
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '刪除按鈕';
                delBtn.onclick = function() {
                    if(confirm(`確定要刪除 ${fileName} 嗎？`)) {
                        deleteFile(fileName);
                    }
                };

                itemDiv.appendChild(link);
                itemDiv.appendChild(delBtn);
                listContainer.appendChild(itemDiv);
            });
        }

        // 依照目前 A 的預設值 (tmp.txt)，在網頁載入時自動讀取 B 的內容
        function initLoad() {
            const files = JSON.parse(localStorage.getItem('cloud_files')) || {};
            const defaultName = inputA.value;
            if (files[defaultName] !== undefined) {
                inputB.value = files[defaultName];
            } else {
                inputB.value = '';
            }
        }

        // 保存功能
        saveBtn.addEventListener('click', function() {
            const fileName = inputA.value.trim();
            const fileContent = inputB.value;

            if (!fileName) {
                alert('請輸入有效的檔案名稱！');
                return;
            }

            const files = JSON.parse(localStorage.getItem('cloud_files')) || {};
            // 以 A 的內容命名並保存 B 的內容
            files[fileName] = fileContent;
            localStorage.setItem('cloud_files', JSON.stringify(files));

            // 成功後處理：A 恢復為 tmp.txt，B 清空
            inputA.value = 'tmp.txt';
            inputB.value = '';

            // 重新刷新列表與預設讀取
            renderFileList();
            initLoad();
            alert('儲存成功！');
        });

        // 刪除功能
        function deleteFile(fileName) {
            const files = JSON.parse(localStorage.getItem('cloud_files')) || {};
            delete files[fileName];
            localStorage.setItem('cloud_files', JSON.stringify(files));
            
            // 如果刪除的剛好是當前輸入框顯示的，則進行清空
            if (inputA.value === fileName) {
                inputA.value = 'tmp.txt';
                initLoad();
            }
            renderFileList();
        }

        // 網頁載入初始化執行
        renderFileList();
        initLoad();
    </script>
</body>
</html>
