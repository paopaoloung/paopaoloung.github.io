<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端文本暫存區 v5 (修正版)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { font-size: 22.5px; height: 200px; resize: vertical; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .file-list { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        .file-item a { color: #007bff; text-decoration: none; }
        .file-item a:hover { text-decoration: underline; }
        .btn-delete { background-color: #dc3545; padding: 5px 10px; font-size: 14px; }
        .btn-delete:hover { background-color: #bd2130; }
        .error-msg { color: #dc3545; background-color: #f8d7da; padding: 10px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>📝 雲端文本暫存區 v5</h2>

    <!-- 輸入框Z：Token驗證 -->
    <div class="form-group">
        <label for="tokenInput">Token 驗證：</label>
        <input type="text" id="tokenInput" value="---請輸入token" onchange="fetchFileList()">
    </div>

    <!-- 輸入框A：檔案名稱 -->
    <div class="form-group">
        <label for="filenameInput">檔案名稱：</label>
        <input type="text" id="filenameInput" value="tmp.txt">
    </div>

    <!-- 輸入框B：文本內容 -->
    <div class="form-group">
        <label for="contentInput">文本內容：</label>
        <textarea id="contentInput" placeholder="正在嘗試讀取 tmp.txt..."></textarea>
    </div>

    <!-- 按鈕：保存 -->
    <div class="form-group">
        <button id="saveBtn" onclick="saveFile()">保存文本</button>
    </div>

    <!-- 目錄文檔列表 -->
    <div class="file-list">
        <h3>📁 目錄文檔列表 (List)</h3>
        <div id="listContainer">正在載入雲端文件清單...</div>
    </div>

    <script>
        const OWNER = "paopaoloung";
        const REPO = "paopaoloung.github.io";
        const FOLDER_PATH = "up/files"; 

        window.onload = function() {
            loadDefaultFile();
            fetchFileList();
        };

        function getToken() {
            const token = document.getElementById('tokenInput').value.trim();
            if (token === "---請輸入token" || !token) return "";
            return token;
        }

        async function loadDefaultFile() {
            const contentInput = document.getElementById('contentInput');
            try {
                const response = await fetch(`https://${OWNER}.github.io/${FOLDER_PATH}/tmp.txt?t=${Date.now()}`);
                if (response.ok) {
                    contentInput.value = await response.text();
                } else {
                    contentInput.value = "";
                    contentInput.placeholder = "預設檔案 tmp.txt 不存在，儲存後會自動建立。";
                }
            } catch (error) {
                contentInput.value = "";
                contentInput.placeholder = "讀取失敗。";
            }
        }

        async function saveFile() {
            const token = getToken();
            if (!token) {
                alert("請先在『Token 驗證』輸入框填入您的 GitHub 有效 Token！");
                return;
            }

            const filenameInput = document.getElementById('filenameInput');
            const contentInput = document.getElementById('contentInput');
            const filename = filenameInput.value.trim();
            const content = contentInput.value;

            if (!filename) { alert("請輸入檔案名稱！"); return; }

            const url = `https://github.com{OWNER}/${REPO}/contents/${FOLDER_PATH}/${filename}`;
            
            try {
                let sha = "";
                const checkRes = await fetch(url, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (checkRes.ok) {
                    const fileData = await checkRes.json();
                    sha = fileData.sha;
                }

                const base64Content = btoa(unescape(encodeURIComponent(content)));
                const bodyData = {
                    message: `Upload ${filename} via web`,
                    content: base64Content
                };
                if (sha) bodyData.sha = sha;

                const saveRes = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(bodyData)
                });

                if (saveRes.ok) {
                    alert(`檔案 ${filename} 保存成功！`);
                    filenameInput.value = "tmp.txt";
                    contentInput.value = "";
                    fetchFileList();
                } else {
                    const errData = await saveRes.json();
                    alert(`保存失敗：${errData.message}`);
                }
            } catch (error) {
                alert(`發生錯誤：${error.message}`);
            }
        }

        async function fetchFileList() {
            const container = document.getElementById('listContainer');
            const url = `https://github.com{OWNER}/${REPO}/contents/${FOLDER_PATH}`;
            
            try {
                const token = getToken();
                const headers = { "Accept": "application/vnd.github.v3+json" };
                if (token) headers["Authorization"] = `token ${token}`;

                const response = await fetch(url, { headers });
                
                if (!response.ok) {
                    if (response.status === 404) {
                        container.innerHTML = `<div class="error-msg">❌ 錯誤 404：找不到雲端目錄！<br>原因：您的儲存庫庫裡還沒有資料夾 "${FOLDER_PATH}"，或者資料夾內是空的。請先隨便『保存』一個文本，目錄就會自動建立！</div>`;
                    } else if (response.status === 403 || response.status === 429) {
                        container.innerHTML = `<div class="error-msg">❌ 錯誤 403：API 讀取次數超限！<br>原因：未輸入 Token 的公開查詢次數已達上限。請在上方輸入您的『Token 驗證』即可解除限制。</div>`;
                    } else if (response.status === 401) {
                        container.innerHTML = `<div class="error-msg">❌ 錯誤 401：Token 無效或過期！<br>原因：您輸入的 Token 錯誤。請檢查是否有多貼空格或權限不足。</div>`;
                    } else {
                        container.innerHTML = `<div class="error-msg">❌ 載入失敗 (狀態碼: ${response.status})</div>`;
                    }
                    return;
                }

                const files = await response.json();
                if (!Array.isArray(files) || files.length === 0) {
                    container.innerHTML = "目前雲端目錄中沒有任何檔案。";
                    return;
                }

                container.innerHTML = "";
                files.forEach(file => {
                    if (file.type === "file") {
                        const item = document.createElement('div');
                        item.className = 'file-item';

                        const link = document.createElement('a');
                        link.href = `https://${OWNER}.github.io/${FOLDER_PATH}/${file.name}`;
                        link.target = "_blank";
                        link.textContent = file.name;

                        const delBtn = document.createElement('button');
                        delBtn.className = 'btn-delete';
                        delBtn.textContent = '刪除按鈕';
                        delBtn.onclick = function() { deleteFile(file.name, file.sha); };

                        item.appendChild(link);
                        item.appendChild(delBtn);
                        container.appendChild(item);
                    }
                });
            } catch (error) {
                container.innerHTML = `<div class="error-msg">❌ 瀏覽器連線異常：${error.message}</div>`;
            }
        }

        async function deleteFile(filename, sha) {
            const token = getToken();
            if (!token) { alert("刪除檔案需要驗證身份，請先在上方填入 Token！"); return; }
            if (!confirm(`確定要刪除雲端上的檔案 ${filename} 嗎？`)) return;

            const url = `https://github.com{OWNER}/${REPO}/contents/${FOLDER_PATH}/${filename}`;
            const bodyData = { message: `Delete ${filename}`, sha: sha };

            try {
                const response = await fetch(url, {
                    method: "DELETE",
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify(bodyData)
                });

                if (response.ok) {
                    alert(`檔案 ${filename} 已成功從雲端刪除！`);
                    fetchFileList();
                } else {
                    const errData = await response.json();
                    alert(`刪除失敗：${errData.message}`);
                }
            } catch (error) {
                alert(`刪除發生錯誤：${error.message}`);
            }
        }
    </script>
</body>
</html>
