<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端文本暫存區</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            color: #333;
        }
        .field-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        textarea {
            width: 100%;
            height: 250px;
            font-size: 22.5px; /* 依照要求設定文字大小 */
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .file-list {
            margin-top: 30px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }
        .file-item:hover {
            background-color: #f9f9f9;
        }
        .file-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
        }
        .file-link:hover {
            text-decoration: underline;
        }
        .btn-delete {
            background-color: #dc3545;
        }
        .btn-delete:hover {
            background-color: #bd2130;
        }
        .status-msg {
            font-size: 14px;
            color: #666;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <h2>雲端文本暫存區</h2>

    <!-- 輸入框Z：個人訪問Token -->
    <div class="field-group">
        <label for="tokenZ">輸入框Z：</label>
        <input type="text" id="tokenZ" placeholder="請輸入token">
        <button id="btnSaveToken">保存token</button>
    </div>

    <!-- 輸入框A：保存文件名 -->
    <div class="field-group">
        <label for="fileNameA">輸入框A：</label>
        <input type="text" id="fileNameA" value="tmp.txt" placeholder="tmp.txt">
    </div>

    <!-- 輸入框B：文件內容 -->
    <div class="field-group">
        <label for="fileContentB">輸入框B：</label>
        <textarea id="fileContentB" placeholder="讀取後顯示tmp.txt文本的內容，如tmp.txt不存在，則留空"></textarea>
        <button id="btnSaveFile">保存文件</button>
        <span id="status" class="status-msg"></span>
    </div>

    <!-- 目錄文檔列表 -->
    <div class="file-list">
        <h3>目錄文檔list</h3>
        <div id="listContainer">請先儲存 Token 以加載雲端文件...</div>
    </div>

    <script>
        // 設定 GitHub 倉庫參數
        const OWNER = 'paopaoloung';
        const REPO = 'paopaoloung.github.io';
        const FOLDER = 'up/files/';

        // 快取雲端檔案的 SHA 識別碼
        let cachedSha = {};

        // 頁面初始化
        document.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('github_token');
            if (savedToken) {
                document.getElementById('tokenZ').value = savedToken;
                initCloudData();
            }

            // 按鈕A：儲存 Token
            document.getElementById('btnSaveToken').addEventListener('click', () => {
                const token = document.getElementById('tokenZ').value.trim();
                if (token) {
                    localStorage.setItem('github_token', token);
                    alert('Token 儲存成功！');
                    initCloudData();
                } else {
                    alert('請輸入有效的 Token');
                }
            });

            // 按鈕保存：上傳或覆蓋檔案
            document.getElementById('btnSaveFile').addEventListener('click', saveFile);

            // 輸入框A變更時，自動加載對應檔案內容
            document.getElementById('fileNameA').addEventListener('change', loadTargetFile);
        });

        // 載入初始數據
        function initCloudData() {
            loadFileList();
            loadTargetFile();
        }

        // 獲取目前輸入的 Token
        function getToken() {
            return document.getElementById('tokenZ').value.trim();
        }

        // 更新狀態提示文字
        function setStatus(msg) {
            document.getElementById('status').innerText = msg;
        }

        // [功能] 讀取輸入框A指定檔案的內容至輸入框B
        async function loadTargetFile() {
            const token = getToken();
            const fileName = document.getElementById('fileNameA').value.trim();
            const textareaB = document.getElementById('fileContentB');

            if (!token || !fileName) return;
            setStatus('正在讀取雲端檔案...');

            try {
                const response = await fetch(`https://github.com{OWNER}/${REPO}/contents/${FOLDER}/${fileName}`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (response.status === 404) {
                    textareaB.value = '';
                    setStatus(`${fileName} 不存在，已留空。`);
                } else if (response.ok) {
                    const data = await response.json();
                    // 解決 GitHub Base64 中文亂碼問題
                    textareaB.value = decodeURIComponent(atob(data.content).split('').map(c => 
                        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
                    ).join(''));
                    setStatus(`${fileName} 讀取成功。`);
                } else {
                    setStatus('讀取失敗，請檢查 Token 權限。');
                }
            } catch (err) {
                setStatus('網路錯誤，讀取失敗。');
            }
        }

        // [功能] 保存文件
        async function saveFile() {
            const token = getToken();
            const fileName = document.getElementById('fileNameA').value.trim();
            const content = document.getElementById('fileContentB').value;

            if (!token) return alert('請先輸入並保存 Token');
            if (!fileName) return alert('文件名不能為空');

            setStatus('正在保存至雲端...');

            // 中文字串轉 Base64
            const base64Content = btoa(encodeURIComponent(content).replace(/%([0-9A-F]{2})/g, (match, p1) => 
                String.fromCharCode('0x' + p1)
            ));

            // 如果檔案已存在，必須取得該檔案的 SHA 才能進行覆蓋
            let sha = cachedSha[fileName] || null;
            try {
                const checkRes = await fetch(`https://github.com{OWNER}/${REPO}/contents/${FOLDER}/${fileName}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (checkRes.ok) {
                    const checkData = await checkRes.json();
                    sha = checkData.sha;
                }
            } catch (e) {}

            const body = {
                message: `Update ${fileName} via cloud text area`,
                content: base64Content
            };
            if (sha) body.sha = sha;

            try {
                const response = await fetch(`https://github.com{OWNER}/${REPO}/contents/${FOLDER}/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (response.ok) {
                    setStatus('保存成功！');
                    // 成功後恢復預設狀態
                    document.getElementById('fileNameA').value = 'tmp.txt';
                    document.getElementById('fileContentB').value = '';
                    // 刷新列表與預設 tmp.txt
                    await loadFileList();
                    await loadTargetFile();
                } else {
                    alert('保存失敗，請檢查儲存庫權限。');
                }
            } catch (err) {
                alert('網路錯誤，保存失敗。');
            }
        }

        // [功能] 讀取目錄文檔清單
        async function loadFileList() {
            const token = getToken();
            const container = document.getElementById('listContainer');
            if (!token) return;

            try {
                const response = await fetch(`https://github.com{OWNER}/${REPO}/contents/${FOLDER}`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (response.status === 404) {
                    container.innerText = '目錄為空（files/ 文件夾不存在）';
                    return;
                }

                if (response.ok) {
                    const files = await response.json();
                    container.innerHTML = '';
                    cachedSha = {};

                    const fileList = files.filter(item => item.type === 'file');
                    if (fileList.length === 0) {
                        container.innerText = '目錄下無任何檔案。';
                        return;
                    }

                    fileList.forEach(file => {
                        cachedSha[file.name] = file.sha;

                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'file-item';

                        // 建立超連結
                        const a = document.createElement('a');
                        a.className = 'file-link';
                        a.href = `https://${OWNER}.github.io/${REPO}/${FOLDER}/${file.name}`;
                        a.target = '_blank';
                        a.innerText = file.name;
// 點擊超連結時同步將檔案名稱寫入輸入框A並讀取內容
a.addEventListener('click', (e) => {
document.getElementById('fileNameA').value = file.name;
loadTargetFile();
});
// 建立刪除按鈕
const delBtn = document.createElement('button');
delBtn.className = 'btn-delete';
delBtn.innerText = '刪除按鈕';
delBtn.addEventListener('click', () => deleteFile(file.name, file.sha));
itemDiv.appendChild(a);
itemDiv.appendChild(delBtn);
container.appendChild(itemDiv);
});
}
} catch (err) {
container.innerText = '加載目錄失敗，請檢查網路。';
}
}
// [功能] 刪除檔案
async function deleteFile(fileName, sha) {
const token = getToken();
if (!confirm(確定要刪除雲端上的 ${fileName} 嗎？)) return;
setStatus(正在刪除 ${fileName}...);
try {
const response = await fetch(https://github.com{OWNER}/${REPO}/contents/${FOLDER}/${fileName}, {
method: 'DELETE',
headers: {
'Authorization': token ${token},
'Content-Type': 'application/json'
},
body: JSON.stringify({
message: Delete ${fileName},
sha: sha
})
});
if (response.ok) {
setStatus(${fileName} 刪除成功。);
await loadFileList();
if (document.getElementById('fileNameA').value === fileName) {
document.getElementById('fileNameA').value = 'tmp.txt';
loadTargetFile();
}
} else {
alert('刪除失敗。');
}
} catch (err) {
alert('網路錯誤，刪除失敗。');
}
}
