<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>File Sync</title>
<style>
body{font-family:Arial;max-width:800px;margin:20px auto}
.row{display:flex;gap:8px;margin:10px 0}
input{flex:1;padding:8px}
button{padding:6px 12px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd}
th{background:#f5f5f5}
</style>
</head>
<body>

<h2>檔案同步8w</h2>

<div class="row">
<input type="password" id="token" placeholder="GitHub Token">
<button onclick="saveToken()">登入</button>
</div>

<div class="row">
<input type="file" id="file">
<button onclick="upload()">上傳</button>
</div>

<table>
<thead>
<tr>
<th>檔案名稱</th>
<th width="80">操作</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>
const owner="paopaoloung",
      repo="paopaoloung.github.io",
      folder="up/files",
      gas="https://script.google.com/macros/s/AKfycbxnsKIPEqbRmya1FKIq7IAxdWjuYXMn2kdBlcs4xdti1ExT2Bx8l45n1hcBaZ3o5YWY/exec";

const $=id=>document.getElementById(id);
const token=$("token"),
      file=$("file"),
      list=$("list");

const tk=()=>localStorage.github_token||"";

const api=(p="")=>
`https://api.github.com/repos/${owner}/${repo}/contents/${folder}${p}`;

const gh=(url,opt={})=>fetch(url,{
 ...opt,
 headers:{
  Authorization:`token ${tk()}`,
  ...(opt.headers||{})
 }
});

token.value=tk();

async function saveToken(){
 let t=token.value.trim();
 if(!t) return alert("請輸入Token");

 localStorage.github_token=t;

 try{
  let r=await gh(api());
  if(!r.ok) throw 0;

  alert("登入成功");
  loadFiles();

 }catch{
  localStorage.removeItem("github_token");
  alert("Token無效");
 }
}

async function toBase64(f){
 return new Promise(r=>{
  let fr=new FileReader();
  fr.onload=()=>r(fr.result.split(",")[1]);
  fr.readAsDataURL(f);
 });
}

async function upload(){

 const f=file.files[0];
 if(!f) return alert("請選擇檔案");

 try{

  let sha="";

  let c=await gh(api("/"+f.name));
  if(c.ok) sha=(await c.json()).sha;

  let r=await gh(api("/"+f.name),{
   method:"PUT",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    message:(sha?"update ":"upload ")+f.name,
    content:await toBase64(f),
    ...(sha&&{sha})
   })
  });

  let j=await r.json();

  if(!r.ok)
   return alert("失敗："+j.message);

  if(gas){
   await fetch(gas,{
    method:"POST",
    body:JSON.stringify({
     action:"add",
     name:f.name,
     url:`https://raw.githubusercontent.com/${owner}/${repo}/main/${folder}/${f.name}`,
     sha:j.content.sha
    })
   });
  }

  file.value="";
  alert(sha?"檔案已覆蓋":"上傳成功");
  loadFiles();

 }catch(e){
  alert("上傳失敗");
 }
}

async function delFile(name,sha){

 if(!confirm("刪除 "+name+" ?")) return;

 try{

  let r=await gh(api("/"+name),{
   method:"DELETE",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    message:"delete "+name,
    sha
   })
  });

  if(!r.ok)
   return alert("刪除失敗");

   if(gas){
    await fetch(gas,{
     method:"POST",
     body:JSON.stringify({
      action:"delete",
      name
     })
    });
   }

   alert("刪除成功");
   loadFiles();

 }catch{
  alert("刪除失敗");
 }
}

async function loadFiles(){

 try{

  const files=await (await fetch(gas)).json();

  list.innerHTML=files
   .sort((a,b)=>a.name.localeCompare(b.name))
   .map(f=>`
   <tr>
    <td>
     <button onclick="open('${f.url}')">
      ${f.name}
     </button>
    </td>
    <td>
     <button onclick="delFile('${f.name}','${f.sha}')">
      刪除
     </button>
    </td>
   </tr>
   `).join("");

 }catch{
  list.innerHTML="";
 }
}

window.onload=()=>tk()&&loadFiles();
</script>

</body>
</html>
