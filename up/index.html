<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件同步</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
        button { margin-left: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>📁 文件同步 (up/files/)</h2>
    
    <!-- Token 設定 -->
    <div style="margin-bottom: 15px;">
        <input type="password" id="tokenInput" placeholder="輸入 GitHub PAT (需有 repo 權限)" style="width: 70%;">
        <button onclick="saveToken()">儲存 Token</button>
    </div>

    <!-- 上傳區 -->
    <div style="margin-bottom: 20px;">
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">上傳檔案</button>
    </div>

    <!-- 檔案列表 -->
    <h3>📄 檔案列表</h3>
    <div id="fileList">請先輸入並儲存 Token</div>

    <script>
        const OWNER = 'paopaoloung';
        const REPO = 'paopaoloung.github.io'; 
        const TARGET_DIR = 'up/files';

        let TOKEN = localStorage.getItem('gh_token') || '';
        if (TOKEN) document.getElementById('tokenInput').value = TOKEN;

        function saveToken() {
            TOKEN = document.getElementById('tokenInput').value.trim();
            localStorage.setItem('gh_token', TOKEN);
            alert('Token 已儲存！');
            loadFiles();
        }

        async function apiFetch(path, options = {}) {
            const url = `https://github.com{OWNER}/${REPO}/contents/${path}`;
            try {
                const res = await fetch(url, {
                    ...options,
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        ...options.headers
                    }
                });
                if (!res.ok && res.status !== 404) {
                    const err = await res.json();
                    throw new Error(err.message || `HTTP ${res.status}`);
                }
                return res;
            } catch (e) {
                // 捕捉網路中斷、跨域或 API 被封鎖的真正原因
                throw new Error(e.message || '網路連線失敗或權限不足');
            }
        }

        async function loadFiles() {
            const listDiv = document.getElementById('fileList');
            if (!TOKEN) { listDiv.innerHTML = '請先輸入並儲存 Token'; return; }
            listDiv.innerHTML = '載入中...';
            try {
                const res = await apiFetch(TARGET_DIR);
                if (res.status === 404) { listDiv.innerHTML = '資料夾暫無檔案（或 up/tmp 目錄尚未建立）'; return; }
                const files = await res.json();
                
                if (!Array.isArray(files)) { listDiv.innerHTML = '無法讀取列表，請確認路徑是否為資料夾'; return; }

                // 按名稱排序
                files.sort((a, b) => a.name.localeCompare(b.name));

                listDiv.innerHTML = files.map(f => `
                    <div class="item">
                        <span>${f.name}</span>
                        <div>
                            <button onclick="window.open('${f.download_url}', '_blank')">下載</button>
                            <button onclick="deleteFile('${f.name}', '${f.sha}')" style="color:red;">刪除</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                listDiv.innerHTML = `讀取失敗: ${err.message}<br><small style="color:gray;">提示：請檢查 Token 是否正確，或按 F12 開啟主控台查看詳細 Console 錯誤。</small>`;
            }
        }

        async function uploadFile() {
            const input = document.getElementById('fileInput');
            if (!input.files.length) return alert('請選擇檔案');
            if (!TOKEN) return alert('請先設定 Token');

            const file = input.files[0];
            const reader = new FileReader();
            
            reader.onload = async () => {
                // 正確精準地擷取 Base64 純字串部分
                const base64Content = reader.result.split(',')[1]; 
                try {
                    let sha;
                    try {
                        const check = await apiFetch(`${TARGET_DIR}/${file.name}`);
                        if (check.ok) { const data = await check.json(); sha = data.sha; }
                    } catch(e){}

                    await apiFetch(`${TARGET_DIR}/${file.name}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            message: `Upload ${file.name} via web`,
                            content: base64Content,
                            sha: sha
                        })
                    });
                    alert('上傳成功！');
                    input.value = '';
                    loadFiles();
                } catch (err) {
                    alert('上傳失敗: ' + err.message);
                }
            };
            reader.readAsDataURL(file);
        }

        async function deleteFile(name, sha) {
            if (!confirm(`確定要刪除 ${name} 嗎？`)) return;
            try {
                await apiFetch(`${TARGET_DIR}/${name}`, {
                    method: 'DELETE',
                    body: JSON.stringify({
                        message: `Delete ${name} via web`,
                        sha: sha
                    })
                });
                alert('刪除成功！');
                loadFiles();
            } catch (err) {
                alert('刪除失敗: ' + err.message);
            }
        }

        if (TOKEN) loadFiles();
    </script>
</body>
</html>
