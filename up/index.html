<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>File Sync</title>
<style>
body{font-family:Arial;max-width:800px;margin:20px auto}
.row{display:flex;gap:8px;margin:10px 0}
input{flex:1;padding:8px}
button{padding:6px 12px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd}
</style>
</head>
<body>

<h2>檔案同步8w</h2>

<div class="row">
<input id="token" type="password" placeholder="GitHub Token">
<button onclick="login()">登入</button>
</div>

<div class="row">
<input id="file" type="file">
<button onclick="upload()">上傳</button>
</div>

<table>
<tr><th>檔案</th><th>刪除</th></tr>
<tbody id="list"></tbody>
</table>

<script>
const owner="paopaoloung",
repo="paopaoloung.github.io",
folder="up/files",
gas="https://script.google.com/macros/s/AKfycbwBUY2s_PSMekpegdNNqoaT0Y3EeUY-_hCWLeDQibnCu9oPzhUf0sk8iTh4MKiDsaLR/exec",
$=i=>document.getElementById(i),
tk=()=>localStorage.tk||"",
api=p=>`https://api.github.com/repos/${owner}/${repo}/contents/${folder}${p||""}`;

token.value=tk();

const gh=(u,o={})=>fetch(u,{
...o,
headers:{
Authorization:`token ${tk()}`,
...(o.headers||{})
}
});

const b64=f=>new Promise(r=>{
let x=new FileReader();
x.onload=()=>r(x.result.split(",")[1]);
x.readAsDataURL(f);
});

async function login(){
if(!token.value)return alert("請輸入Token");
localStorage.tk=token.value;
let r=await gh(api(""));
r.ok?(alert("登入成功"),load()):
(localStorage.removeItem("tk"),alert("Token無效"));
}

async function upload(){
let f=file.files[0];
if(!f)return alert("請選擇檔案");

let sha="",c=await gh(api("/"+f.name));
if(c.ok)sha=(await c.json()).sha;

let r=await gh(api("/"+f.name),{
method:"PUT",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
message:(sha?"update ":"upload ")+f.name,
content:await b64(f),
...(sha&&{sha})
})
});

let j=await r.json();
if(!r.ok)return alert(j.message);

fetch(gas,{
method:"POST",
body:JSON.stringify({
action:"add",
name:f.name,
url:`https://raw.githubusercontent.com/${owner}/${repo}/main/${folder}/${f.name}`,
sha:j.content.sha
})
});

file.value="";
alert("完成");
load();
}

async function del(name,sha){
if(!confirm("刪除 "+name+" ?"))return;

await gh(api("/"+name),{
method:"DELETE",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
message:"delete "+name,
sha
})
});

fetch(gas,{
method:"POST",
body:JSON.stringify({
action:"delete",
name
})
});

load();
}

async function load(){
let files=await (await fetch(gas)).json();

list.innerHTML=files
.sort((a,b)=>a.name.localeCompare(b.name))
.map(f=>`
<tr>
<td>
<button onclick="open('${f.url}')">
${f.name}
</button>
</td>
<td>
<button onclick="del('${f.name}','${f.sha}')">
刪除
</button>
</td>
</tr>`).join("");
}

tk()&&load();
</script>

</body>
</html>
