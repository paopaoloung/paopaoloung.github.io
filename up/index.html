<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>File Sync</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:20px auto}
li{margin:5px 0}
button{margin-left:5px}
</style>
</head>
<body>

<input type="file" id="file">
<button onclick="upload()">上傳</button>

<ul id="list"></ul>

<script>
const owner="paopaoloung";
const repo="paopaoloung.github.io";
const path="up/files";
const token="YOUR_GITHUB_TOKEN";

async function upload(){
  const f=document.getElementById('file').files[0];
  if(!f) return;

  const content=btoa(
    new Uint8Array(await f.arrayBuffer())
      .reduce((a,b)=>a+String.fromCharCode(b),'')
  );

  await fetch(
    `https://api.github.com/repos/${owner}/${repo}/contents/${path}/${f.name}`,
    {
      method:"PUT",
      headers:{
        Authorization:`token ${token}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:`upload ${f.name}`,
        content
      })
    }
  );

  loadFiles();
}

async function loadFiles(){
  const r=await fetch(
    `https://api.github.com/repos/${owner}/${repo}/contents/${path}`
  );

  const files=(await r.json())
      .sort((a,b)=>a.name.localeCompare(b.name));

  const ul=document.getElementById("list");
  ul.innerHTML="";

  files.forEach(f=>{
    const li=document.createElement("li");

    li.innerHTML=
      `${f.name}
      <a href="${f.download_url}" download>下載</a>
      <button onclick="delFile('${f.name}','${f.sha}')">刪除</button>`;

    ul.appendChild(li);
  });
}

async function delFile(name,sha){
  await fetch(
    `https://api.github.com/repos/${owner}/${repo}/contents/${path}/${name}`,
    {
      method:"DELETE",
      headers:{
        Authorization:`token ${token}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:`delete ${name}`,
        sha
      })
    }
  );

  loadFiles();
}

loadFiles();
</script>

</body>
</html>
