<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>File Sync</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:20px auto;
    padding:10px;
}

.row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

input[type=text]{
    flex:1;
    padding:8px;
}

button{
    padding:6px 12px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border-bottom:1px solid #ddd;
    padding:8px;
    text-align:left;
}

th{
    background:#f5f5f5;
}

.actions{
    display:flex;
    gap:6px;
}

a{
    text-decoration:none;
}
</style>
</head>

<body>

<h2>檔案同步</h2>

<div class="row">
    <input type="text"
           id="token"
           placeholder="請輸入 GitHub Token">
    <button onclick="saveToken()">保存</button>
</div>

<div class="row">
    <input type="file" id="file">
    <button onclick="upload()">上傳</button>
</div>

<table>
    <thead>
        <tr>
            <th>檔案名稱</th>
            <th width="80">下載</th>
            <th width="80">刪除</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>

<script>

const owner="paopaoloung";
const repo="paopaoloung.github.io";
const folder="up/files";

document.getElementById("token").value=
    localStorage.getItem("github_token") || "";

function getToken(){
    return localStorage.getItem("github_token");
}

async function saveToken(){

    const token=
        document.getElementById("token").value.trim();

    if(!token){
        alert("請輸入 Token");
        return;
    }

    localStorage.setItem(
        "github_token",
        token
    );

    try{

        const r=await fetch(
            `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`,
            {
                headers:{
                    Authorization:`token ${token}`
                }
            }
        );

        if(!r.ok){
            alert("Token 無效或沒有權限");
            return;
        }

        await loadFiles();

        alert("Token 已保存");

    }catch(e){

        console.error(e);
        alert("讀取檔案失敗");

    }
}

async function upload(){

    const token=getToken();

    if(!token){
        alert("請先輸入 Token");
        return;
    }

    const file=document.getElementById("file").files[0];

    if(!file){
        alert("請選擇檔案");
        return;
    }

    const bytes=new Uint8Array(
        await file.arrayBuffer()
    );

    let binary='';

    bytes.forEach(b=>{
        binary+=String.fromCharCode(b);
    });

    const content=btoa(binary);

    await fetch(
        `https://api.github.com/repos/${owner}/${repo}/contents/${folder}/${file.name}`,
        {
            method:"PUT",
            headers:{
                Authorization:`token ${token}`,
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:`upload ${file.name}`,
                content:content
            })
        }
    );

    loadFiles();
}

async function delFile(name,sha){

    const token=getToken();

    if(!confirm(`刪除 ${name} ?`))
        return;

    await fetch(
        `https://api.github.com/repos/${owner}/${repo}/contents/${folder}/${name}`,
        {
            method:"DELETE",
            headers:{
                Authorization:`token ${token}`,
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:`delete ${name}`,
                sha:sha
            })
        }
    );

    loadFiles();
}

async function loadFiles(){

    try{

        const r=await fetch(
            `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
        );

        const files=await r.json();

        files.sort((a,b)=>
            a.name.localeCompare(b.name)
        );

        const tbody=document.getElementById("list");

        tbody.innerHTML="";

        files.forEach(file=>{

            const tr=document.createElement("tr");

            tr.innerHTML=`
                <td>${file.name}</td>
                <td>
                    <a href="${file.download_url}" target="_blank">
                        下載
                    </a>
                </td>
                <td>
                    <button onclick="delFile('${file.name}','${file.sha}')">
                        刪除
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
        });

    }catch(e){
        console.error(e);
    }
}

window.onload=async()=>{

    const token=localStorage.getItem("github_token");

    if(token){

        document.getElementById("token").value=token;

        await loadFiles();

    }

};

</script>

</body>
</html>
