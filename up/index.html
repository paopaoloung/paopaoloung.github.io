<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>File Sync</title>
<style>
body{
  font-family:Arial;
  max-width:800px;
  margin:20px auto;
}
.row{
  display:flex;
  gap:8px;
  margin:10px 0;
}
input{
  flex:1;
  padding:8px;
}
button{
  padding:6px 12px;
  cursor:pointer;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
}
th{
  background:#f5f5f5;
}
a{
  color:#0066cc;
  text-decoration:none;
}
a:hover{
  text-decoration:underline;
}
</style>
</head>
<body>
<h2>檔案同步8w</h2>
<div class="row">
  <input type="password" id="token" placeholder="GitHub Token">
  <button onclick="saveToken()">登入</button>
</div>
<font color="white" size=2>github_pat_11A7UNAAA0eawLmt2kC0GI_qiGQBNVZcXYV5nf6GIw7bPI6qiORZVBBY1ikovLpQ6D5U2OKJ73TYdb9q</font>
<div class="row">
  <input type="file" id="file">
  <button onclick="upload()">上傳</button>
</div>
<table>
<thead>
<tr>
  <th>檔案名稱</th>
  <th width="80">刪除</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
<script>
const owner="paopaoloung";
const repo="paopaoloung.github.io";
const folder="up/files";
const gas="https://script.google.com/macros/s/AKfycbwBUY2s_PSMekpegdNNqoaT0Y3EeUY-_hCWLeDQibnCu9oPzhUf0sk8iTh4MKiDsaLR/exec";
const token=document.getElementById("token");
const file=document.getElementById("file");
const list=document.getElementById("list");
const tk=()=>localStorage.github_token||"";
const api=(p="")=>
`https://api.github.com/repos/${owner}/${repo}/contents/${folder}${p}`;
token.value=tk();
function headers(){
  return {
    Authorization:`token ${tk()}`
  };
}
async function saveToken(){
  const t=token.value.trim();
  if(!t) return alert("請輸入Token");
  localStorage.github_token=t;
  try{
    const r=await fetch(api(),{
      headers:headers()
    });
    if(!r.ok) throw new Error();
    alert("登入成功");
    loadFiles();
  }catch{
    localStorage.removeItem("github_token");
    alert("Token無效");
  }
}
async function fileToBase64(f){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=()=>{
      resolve(reader.result.split(",")[1]);
    };
    reader.readAsDataURL(f);
  });
}
async function upload(){
  const f=file.files[0];
  if(!f) return alert("請選擇檔案");
  try{
    let sha="";
    const check=await fetch(api("/"+f.name),{
      headers:headers()
    });
    if(check.ok){
      sha=(await check.json()).sha;
    }
    const r=await fetch(api("/"+f.name),{
      method:"PUT",
      headers:{
        ...headers(),
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:(sha?"update ":"upload ")+f.name,
        content:await fileToBase64(f),
        ...(sha&&{sha})
      })
    });
    const data=await r.json();
    if(!r.ok){
      return alert(data.message);
    }
    try{
      await fetch(gas,{
        method:"POST",
        body:JSON.stringify({
          action:"add",
          name:f.name,
          url:`https://raw.githubusercontent.com/${owner}/${repo}/main/${folder}/${f.name}`,
          sha:data.content.sha
        })
      });
    }catch(err){
      console.error("GAS失敗",err);
    }
    file.value="";
    alert(sha?"檔案已覆蓋":"上傳成功");
    loadFiles();
  }catch(e){
    console.error(e);
    alert("上傳失敗");
  }
}
async function delFile(name,sha){
  if(!confirm("確定刪除 "+name+" ?")) return;
  try{
    const r=await fetch(api("/"+name),{
      method:"DELETE",
      headers:{
        ...headers(),
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:"delete "+name,
        sha
      })
    });
    if(!r.ok){
      return alert("刪除失敗");
    }
    try{
      await fetch(gas,{
        method:"POST",
        body:JSON.stringify({
          action:"delete",
          name:name
        })
      });
    }catch(err){
      console.error("GAS失敗",err);
    }
    alert("刪除成功");
    loadFiles();
  }catch(e){
    console.error(e);
    alert("刪除失敗");
  }
}
async function loadFiles(){
  try{
    const r=await fetch(gas);
    const files=await r.json();
    list.innerHTML=files
      .sort((a,b)=>
        String(a.name).localeCompare(String(b.name))
      )
      .map(f=>`
      <tr>
        <td>
          <a href="${f.url}" target="_blank">
            ${f.name}
          </a>
        </td>
        <td style="text-align:center">
          <button onclick="delFile('${f.name}','${f.sha}')">
            刪除
          </button>
        </td>
      </tr>
      `)
      .join("");
  }catch(e){
    console.error(e);
    list.innerHTML=`
      <tr>
        <td colspan="2">
          無法讀取檔案列表
        </td>
      </tr>
    `;
  }
}
window.onload=()=>{
  if(tk()) loadFiles();
};
</script>
</body>
</html>
