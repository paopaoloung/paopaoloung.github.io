<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>File Sync</title>
<style>
body{font-family:Arial;max-width:800px;margin:20px auto}
.row{display:flex;gap:8px;margin:10px 0}
input[type=text]{flex:1;padding:8px;}
button{padding:6px 12px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd}
th{background:#f5f5f5}
</style>
</head>
<body>

<h2>檔案同步8w</h2>

<div class="row">
<input type="password" id="token" placeholder="GitHub Token" width="280">
<button onclick="saveToken()">登入</button>
</div>

<div class="row">
<input type="file" id="file">
<button onclick="upload()">上傳</button>
</div>

<p><font color="white" size=2>github_pat_11A7UNAAA0eawLmt2kC0GI_qiGQBNVZcXYV5nf6GIw7bPI6qiORZVBBY1ikovLpQ6D5U2OKJ73TYdb9q</font>
<table>
<thead>
<tr>
<th>檔案名稱</th>
<th width="80">下載</th>
<th width="80">刪除</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>
const owner="paopaoloung",
repo="paopaoloung.github.io",
folder="up/files";

const api=(path="")=>
`https://api.github.com/repos/${owner}/${repo}/contents/${folder}${path}`;

const tokenBox=document.getElementById("token");
tokenBox.value=localStorage.github_token||"";

const getToken=()=>localStorage.github_token||"";

async function saveToken(){
    let token=tokenBox.value.trim();
    if(!token)return alert("請輸入Token");

    localStorage.github_token=token;

    try{
        let r=await fetch(api(),{
            headers:{Authorization:`token ${token}`}
        });

        if(!r.ok) throw 0;

        loadFiles();
    }catch{
        alert("Token無效");
    }
}

async function upload(){
    let f=file.files[0];
    if(!f)
        return alert("請選擇檔案");
    try{
        let bytes=new Uint8Array(
            await f.arrayBuffer()
        );

        let b64=btoa(
            [...bytes]
            .map(x=>String.fromCharCode(x))
            .join("")
        );
        let r=await fetch(api("/"+f.name),{
            method:"PUT",
            headers:{
                Authorization:`token ${getToken()}`,
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:`upload ${f.name}`,
                content:b64
            })
        });
        let data=await r.json();
        if(!r.ok){
            alert(
                "上傳失敗\n"+
                (data.message||"未知錯誤")
            );
            return;
        }
        // 立即顯示於第一列
        list.insertAdjacentHTML(
            "afterbegin",
            `<tr id="temp_${Date.now()}">
                <td>${f.name}<br>
                <small>/up/files/${f.name}</small></td>
                <td>處理中...</td>
                <td>-</td>
            </tr>`
        );
        // 清空檔案選擇
        file.value="";
        alert("上傳成功");
    }catch(e){
        console.error(e);
        alert("上傳失敗");
    }
}

async function delFile(name,sha){
    if(!confirm(`刪除 ${name} ?`)) return;

    await fetch(api("/"+name),{
        method:"DELETE",
        headers:{
            Authorization:`token ${getToken()}`,
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            message:`delete ${name}`,
            sha
        })
    });

    loadFiles();
}

async function loadFiles(){
    let r=await fetch(api());
    let files=await r.json();

    list.innerHTML="";

    files.sort((a,b)=>a.name.localeCompare(b.name))
    .forEach(f=>{
        list.innerHTML+=`
        <tr>
            <td>${f.name}</td>
            <td><a href="${f.download_url}" target="_blank">下載</a></td>
            <td><button onclick="delFile('${f.name}','${f.sha}')">刪除</button></td>
        </tr>`;
    });
}

window.onload=()=>{
    if(getToken()) loadFiles();
};
</script>

</body>
</html>
