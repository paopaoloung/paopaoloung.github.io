<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>File Sync</title>
<style>
body{font-family:Arial;max-width:800px;margin:20px auto}
.row{display:flex;gap:8px;margin:10px 0}
input{flex:1;padding:8px}
button{padding:6px 12px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd}
th{background:#f5f5f5}
a{text-decoration:none;color:#06c}
</style>
</head>
<body>

<h2>檔案同步8w</h2>

<div class="row">
    <input type="password" id="token" placeholder="GitHub Token">
    <button id="loginBtn">登入</button>
</div>

<font color="white" size="2">
github_pat_11A7UNAAA0eawLmt2kC0GI_qiGQBNVZcXYV5nf6GIw7bPI6qiORZVBBY1ikovLpQ6D5U2OKJ73TYdb9q
</font>

<div class="row">
    <input type="file" id="file">
    <button id="uploadBtn">上傳</button>
</div>

<table>
<thead>
<tr>
<th>檔案名稱</th>
<th width="80">刪除</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>

const owner="paopaoloung";
const repo="paopaoloung.github.io";
const folder="up/files";

const gas="https://script.google.com/macros/s/AKfycbwBUY2s_PSMekpegdNNqoaT0Y3EeUY-_hCWLeDQibnCu9oPzhUf0sk8iTh4MKiDsaLR/exec";

const token=document.getElementById("token");
const file=document.getElementById("file");
const list=document.getElementById("list");

const tk=()=>localStorage.getItem("github_token")||"";

function api(path=""){
    return `https://api.github.com/repos/${owner}/${repo}/contents/${folder}${path}`;
}

function headers(){
    return{
        Authorization:"Bearer "+tk(),
        Accept:"application/vnd.github+json"
    };
}

token.value=tk();

async function saveToken(){

    const t=token.value.trim();

    if(!t){
        alert("請輸入Token");
        return;
    }

    try{

        const r=await fetch(
            "https://api.github.com/user",
            {
                headers:{
                    Authorization:"Bearer "+t,
                    Accept:"application/vnd.github+json"
                }
            }
        );

        const d=await r.json();

        if(!r.ok){
            alert(d.message||"Token無效");
            return;
        }

        localStorage.setItem("github_token",t);

        alert("登入成功："+d.login);

        loadFiles();

    }catch(e){

        console.error(e);

        alert("Token無效");
    }
}

function fileToBase64(f){
    return new Promise(resolve=>{
        const r=new FileReader();
        r.onload=()=>resolve(r.result.split(",")[1]);
        r.readAsDataURL(f);
    });
}

async function upload(){

    const f=file.files[0];

    if(!f){
        alert("請選擇檔案");
        return;
    }

    try{

        let sha="";

        const check=await fetch(
            api("/"+encodeURIComponent(f.name)),
            {headers:headers()}
        );

        if(check.ok){
            sha=(await check.json()).sha;
        }

        const r=await fetch(
            api("/"+encodeURIComponent(f.name)),
            {
                method:"PUT",
                headers:{
                    ...headers(),
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    message:(sha?"update ":"upload ")+f.name,
                    content:await fileToBase64(f),
                    ...(sha && {sha})
                })
            }
        );

        const d=await r.json();

        if(!r.ok){
            alert(d.message||"上傳失敗");
            return;
        }

        try{
            await fetch(gas,{
                method:"POST",
                body:JSON.stringify({
                    action:"add",
                    name:f.name,
                    url:`https://raw.githubusercontent.com/${owner}/${repo}/main/${folder}/${encodeURIComponent(f.name)}`,
                    sha:d.content.sha
                })
            });
        }catch(err){
            console.log(err);
        }

        file.value="";

        alert(sha?"檔案已覆蓋":"上傳成功");

        loadFiles();

    }catch(e){
        console.error(e);
        alert("上傳失敗");
    }
}

async function delFile(name,sha){

    if(!confirm("確定刪除 "+name+" ?")){
        return;
    }

    try{

        const r=await fetch(
            api("/"+encodeURIComponent(name)),
            {
                method:"DELETE",
                headers:{
                    ...headers(),
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    message:"delete "+name,
                    sha:sha
                })
            }
        );

        if(!r.ok){
            alert("刪除失敗");
            return;
        }

        try{
            await fetch(gas,{
                method:"POST",
                body:JSON.stringify({
                    action:"delete",
                    name:name
                })
            });
        }catch(err){}

        alert("刪除成功");

        loadFiles();

    }catch(e){
        console.error(e);
        alert("刪除失敗");
    }
}

async function loadFiles(){

    try{

        const r=await fetch(gas);

        const files=await r.json();

        list.innerHTML=files
            .sort((a,b)=>
                String(a.name).localeCompare(String(b.name))
            )
            .map(f=>`
                <tr>
                    <td>
                        <a href="${f.url}" target="_blank">
                            ${f.name}
                        </a>
                    </td>
                    <td align="center">
                        <button onclick="delFile(${JSON.stringify(f.name)},${JSON.stringify(f.sha||"")})">
                            刪除
                        </button>
                    </td>
                </tr>
            `)
            .join("");

    }catch(e){

        console.error(e);

        list.innerHTML=
        "<tr><td colspan='2'>無法讀取檔案列表</td></tr>";
    }
}

document.getElementById("loginBtn")
.addEventListener("click",saveToken);

document.getElementById("uploadBtn")
.addEventListener("click",upload);

window.addEventListener("load",()=>{
    if(tk()) loadFiles();
});

</script>

</body>
</html>
