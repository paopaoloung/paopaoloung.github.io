<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>File Sync</title>
<style>
body{font-family:Arial;max-width:800px;margin:20px auto}
.row{display:flex;gap:8px;margin:10px 0}
input{flex:1;padding:8px}
button{padding:6px 12px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd}
th{background:#f5f5f5}
small{color:#888}
</style>
</head>

<body>

<h2>檔案同步8w</h2>

<div class="row">
<input type="password" id="token" placeholder="GitHub Token">
<button onclick="saveToken()">登入</button>
</div>

<div class="row">
<input type="file" id="file">
<button onclick="upload()">上傳</button>
</div>

<table>
<tr>
<th>檔案名稱</th>
<th width="80">下載</th>
<th width="80">刪除</th>
</tr>
<tbody id="list"></tbody>
</table>

<script>

const owner="paopaoloung",
repo="paopaoloung.github.io",
folder="up/files",
api=p=>`https://api.github.com/repos/${owner}/${repo}/contents/${folder}${p||""}`;

token.value=localStorage.github_token||"";
const tk=()=>localStorage.github_token||"";

async function saveToken(){
 let t=token.value.trim();
 if(!t)return alert("請輸入Token");
 localStorage.github_token=t;
 try{
  let r=await fetch(api(""),{headers:{Authorization:`token ${t}`}});
  if(!r.ok)throw 0;
  loadFiles();
 }catch{
  alert("Token無效");
 }
}

async function upload(){

 let f=file.files[0];
 if(!f)return alert("請選擇檔案");

 try{

  let b64=btoa([...new Uint8Array(await f.arrayBuffer())]
  .map(x=>String.fromCharCode(x)).join(""));

  let sha="";

  let c=await fetch(api("/"+f.name),{
   headers:{Authorization:`token ${tk()}`}
  });

  if(c.ok) sha=(await c.json()).sha;

  let r=await fetch(api("/"+f.name),{
   method:"PUT",
   headers:{
    Authorization:`token ${tk()}`,
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    message:(sha?"update ":"upload ")+f.name,
    content:b64,
    ...(sha&&{sha})
   })
  });

  let j=await r.json();

  if(!r.ok)
   return alert("失敗："+j.message);

  list.insertAdjacentHTML("afterbegin",`
   <tr>
    <td>${f.name}<br><small>/${folder}/${f.name}</small></td>
    <td>${sha?"已覆蓋":"同步中"}</td>
    <td>-</td>
   </tr>`);

  file.value="";

  alert(sha?"檔案已覆蓋":"上傳成功");

  setTimeout(loadFiles,1000);

 }catch(e){
  alert("上傳失敗");
 }

}

async function delFile(n,sha){

 if(!confirm("刪除 "+n+" ?"))return;

 try{

  let r=await fetch(api("/"+n),{
   method:"DELETE",
   headers:{
    Authorization:`token ${tk()}`,
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    message:"delete "+n,
    sha
   })
  });

  if(!r.ok)
   return alert("刪除失敗");

  alert("刪除成功");

  loadFiles();

 }catch{
  alert("刪除失敗");
 }

}

async function loadFiles(){

 try{

  let files=await (await fetch(api(""))).json();

  if(!Array.isArray(files))return;

  files.sort((a,b)=>a.name.localeCompare(b.name));

  list.innerHTML=files.map(f=>`
   <tr>
    <td>${f.name}<br>
    <small>/${folder}/${f.name}</small></td>
    <td><a href="${f.download_url}" target="_blank">下載</a></td>
    <td><button onclick="delFile('${f.name}','${f.sha}')">刪除</button></td>
   </tr>`).join("");

 }catch(e){
  console.log(e);
 }

}

window.onload=()=>tk()&&loadFiles();

</script>
</body>
</html>
