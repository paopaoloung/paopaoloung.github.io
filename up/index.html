<script>
const owner="paopaoloung";
const repo="paopaoloung.github.io";
const folder="up/files";
const gas="https://script.google.com/macros/s/AKfycbwBUY2s_PSMekpegdNNqoaT0Y3EeUY-_hCWLeDQibnCu9oPzhUf0sk8iTh4MKiDsaLR/exec";

const token=document.getElementById("token");
const file=document.getElementById("file");
const list=document.getElementById("list");

const tk=()=>localStorage.getItem("github_token")||"";
const api=(p="")=>`https://api.github.com/repos/${owner}/${repo}/contents/${folder}${p}`;

token.value=tk();

function headers(){
 return{
  Authorization:"Bearer "+tk(),
  Accept:"application/vnd.github+json"
 };
}

async function saveToken(){
 let t=token.value.trim();
 if(!t)return alert("請輸入Token");

 try{
  let r=await fetch("https://api.github.com/user",{
   headers:{
    Authorization:"Bearer "+t,
    Accept:"application/vnd.github+json"
   }
  });

  let d=await r.json();

  if(!r.ok) throw d;

  localStorage.setItem("github_token",t);
  alert("登入成功："+d.login);
  loadFiles();

 }catch(e){
  console.log(e);
  alert("Token無效");
 }
}

function fileToBase64(f){
 return new Promise(r=>{
  let fr=new FileReader();
  fr.onload=()=>r(fr.result.split(",")[1]);
  fr.readAsDataURL(f);
 });
}

async function upload(){
 let f=file.files[0];
 if(!f)return alert("請選擇檔案");

 try{
  let sha="";

  let chk=await fetch(api("/"+encodeURIComponent(f.name)),{
   headers:headers()
  });

  if(chk.ok) sha=(await chk.json()).sha;

  let r=await fetch(api("/"+encodeURIComponent(f.name)),{
   method:"PUT",
   headers:{...headers(),"Content-Type":"application/json"},
   body:JSON.stringify({
    message:(sha?"update ":"upload ")+f.name,
    content:await fileToBase64(f),
    ...(sha&&{sha})
   })
  });

  let d=await r.json();

  if(!r.ok) return alert(d.message);

  try{
   await fetch(gas,{
    method:"POST",
    body:JSON.stringify({
     action:"add",
     name:f.name,
     url:`https://raw.githubusercontent.com/${owner}/${repo}/main/${folder}/${encodeURIComponent(f.name)}`,
     sha:d.content.sha
    })
   });
  }catch(e){}

  file.value="";
  alert(sha?"檔案已覆蓋":"上傳成功");
  loadFiles();

 }catch(e){
  console.error(e);
  alert("上傳失敗");
 }
}
