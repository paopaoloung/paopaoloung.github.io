<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臨時文件同步 · 仪表板</title>
<style>
body { font-family: sans-serif; max-width: 700px; margin: auto; padding: 16px; }
input, button { width: 100%; margin: 8px 0; padding: 10px; box-sizing: border-box; }
#fileList div { background: #f5f5f5; margin: 4px 0; padding: 8px; display: flex; justify-content: space-between; align-items: center; }
a { color: #0366d6; text-decoration: none; }
button { background: #2ea44f; color: white; border: none; cursor: pointer; }
button.del { background: #d73a49; width: auto; padding: 6px 12px; margin: 0; }
.limit-note { color: #666; font-size: 0.9em; margin: -4px 0 8px; }
</style>
</head>
<body>
<h2>📁 臨時文件同步 11A7UNAAA0PFA3NROmWMdU_</h2>

<p>输入你的 GitHub Personal Access Token（只保存在本机浏览器）</p>
<input id="tokenInput" value="github_pat_" placeholder="ghp_xxxxxxxxxxxx" />
<button onclick="saveToken()">保存 Token</button>
<hr>

<h3>🖼️ 上传文件（图片、PDF等）</h3> 
<p class="limit-note">文件大小限制：50MB（超过75MB将无法上传）</p>
<input type="file" id="fileInput" />
<button onclick="uploadFile()">上传文件</button>

<h3>📄 已有文件列表</h3>
<div id="fileList">加载中...</div>

<script>
const OWNER = 'paopaoloung'; 
const REPO = 'paopaoloung.github.io';
const BRANCH = 'main';
const FOLDER = 'up/files';
const MAX_FILE_SIZE_MB = 50;

// ---------- 工具函数 ----------
function getToken() {
  return document.getElementById('tokenInput').value.trim() || localStorage.getItem('gh_token') || '';
}

function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if(t) {
    localStorage.setItem('gh_token', t);
    alert('Token 已保存');
    refreshList();
  } else {
    alert('请输入有效的 Token');
  }
}

async function apiCall(method, path, body) {
  const token = getToken();
  if(!token) throw new Error('请先输入 Token');
  
  const url = `https://github.com{OWNER}/${REPO}/contents/${path}`;
    
  const options = {
    method: method,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    }
  };
  if(body) options.body = JSON.stringify(body);
  const res = await fetch(url, options);
  
  if (!res.ok && res.status !== 404) {
    const err = await res.json();
    throw new Error(err.message || 'API error');
  }
  return res;
}

// ---------- 文件列表操作 ----------
async function refreshList() {
  const container = document.getElementById('fileList');
  container.innerHTML = '加载中...';
  try {
    const res = await apiCall('GET', FOLDER);
    
    if (res.status === 404) {
      container.innerHTML = '<div>暂无文件</div>';
      return;
    }
    
    const data = await res.json();
    const files = Array.isArray(data) ? data.filter(item => item.type === 'file') : [data];

    if (files.length === 0) {
      container.innerHTML = '<div>暂无文件</div>';
      return;
    }
    container.innerHTML = '';
    for (const file of files) {
      const div = document.createElement('div');
      const link = document.createElement('a');
      
      link.href = `https://${OWNER}.github.io/${file.path}`;
      link.target = '_blank';
      link.textContent = file.name;
      
      const delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.textContent = '删除';
      delBtn.onclick = async () => {
        if (!confirm('确定删除?')) return;
        try {
          await deleteFile(file.path, file.sha);
          refreshList();
        } catch (err) {
          alert('删除失败: ' + err.message);
        }
      };
      div.appendChild(link);
      div.appendChild(delBtn);
      container.appendChild(div);
    }
  } catch(e) {
    container.innerHTML = `<div style="color:red">错误: ${e.message}</div>`;
  }
}

// ---------- 上传文件 ----------
async function uploadFile() {
  const fileInput = document.getElementById('fileInput');
  
  // ✅ 已修正安全寫法：確保正確抓到第一個檔案
  if (!fileInput.files || fileInput.files.length === 0) {
    return alert('请选择文件');
  }
  const file = fileInput.files.item(0); 

  const maxBytes = MAX_FILE_SIZE_MB * 1024 * 1024;
  if (file.size > maxBytes) {
    alert(`文件过大！请选择小于 ${MAX_FILE_SIZE_MB} MB 的文件（当前文件约 ${(file.size / 1024 / 1024).toFixed(1)} MB）`);
    return;
  }

  const reader = new FileReader();
  reader.onload = async function(e) {
    // ✅ 已修正安全寫法：正確提取不含前綴的 Base64 內容
    const dataUrl = e.target.result;
    const base64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
    
    const path = `${FOLDER}/${file.name}`;
    try {
      let sha = null;
      const checkRes = await apiCall('GET', path);
      if (checkRes.status === 200) {
        const data = await checkRes.json();
        sha = data.sha;
      }
      const body = {
        message: `Upload ${file.name}`,
        content: base64,
        branch: BRANCH,
        sha: sha
      };
      await apiCall('PUT', path, body);
      alert('上传成功');
      fileInput.value = '';
      refreshList();
    } catch(err) {
      alert('上传失败: ' + err.message);
    }
  };
  reader.readAsDataURL(file);
}

// ---------- 删除文件 ----------
async function deleteFile(path, sha) {
  const body = { message: `Delete ${path}`, sha, branch: BRANCH };
  await apiCall('DELETE', path, body);
}

// ---------- 初始化 ----------
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('gh_token');
  if(saved) document.getElementById('tokenInput').value = saved;
  
  if (getToken()) {
    refreshList();
  } else {
    document.getElementById('fileList').innerHTML = '<div>请先输入并保存 Token 以加载文件列表。</div>';
  }
});
</script>
</body>
</html>
