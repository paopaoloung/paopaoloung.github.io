<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临时文件同步</title>
<style>
body { font-family: sans-serif; max-width: 700px; margin: auto; padding: 16px; }
input, textarea, button { width: 100%; margin: 8px 0; padding: 10px; box-sizing: border-box; }
#fileList div { background: #f5f5f5; margin: 4px 0; padding: 8px; display: flex; justify-content: space-between; align-items: center; }
a { color: #0366d6; text-decoration: none; }
button { background: #2ea44f; color: white; border: none; cursor: pointer; }
button.del { background: #d73a49; width: auto; }
.limit-note { color: #666; font-size: 0.9em; margin: -4px 0 8px; }
</style>
</head>
<body>

<h2>📁 临时文件同步</h2>

<!-- 狀態面板內容已依要求刪除 -->

<p>输入你的 GitHub Personal Access Token（只保存在本机浏览器，切勿硬编码进代码中）</p>
<input id="tokenInput" type="password" placeholder="ghp_xxxxxx 或 github_pat_xxxxxx" value="" />
<button onclick="saveToken()">保存 Token</button>
<hr>

<h3>🖼️ 上传文件（图片、PDF等）</h3>
<p class="limit-note">文件大小限制：50MB（超过75MB将无法上传）</p>
<input type="file" id="fileInput" />
<button onclick="uploadFile()">上传文件</button>

<h3>📄 已有文件列表</h3>
<div id="fileList">加载中...</div>

<script>
const OWNER = 'paopaoloung'; 
const REPO = 'paopaoloung.github.io';
const BRANCH = 'main';
const FOLDER = 'up/files';
const MAX_FILE_SIZE_MB = 50;

// ---------- 工具函数 ----------
function getToken() {
  return document.getElementById('tokenInput').value || localStorage.getItem('gh_token') || '';
}

function saveToken() {
  const t = document.getElementById('tokenInput').value;
  if(t) {
    localStorage.setItem('gh_token', t);
    alert('Token 已成功保存至本地瀏覽器儲存區 (LocalStorage)');
    fetchRepoSize();
    refreshList();
  } else {
    alert('请输入有效的 Token');
  }
}

// ---------- API 调用封装（自动更新速率限制显示，已加上安全防錯）----------
function updateRateDisplay(headers) {
  if (!headers) return;
  const limit = parseInt(headers.get('X-RateLimit-Limit'));
  const remaining = parseInt(headers.get('X-RateLimit-Remaining'));
  const reset = parseInt(headers.get('X-RateLimit-Reset'));
  
  const elUsed = document.getElementById('apiUsed');
  const elRemaining = document.getElementById('apiRemaining');
  const elReset = document.getElementById('apiReset');

  if (!isNaN(limit) && !isNaN(remaining) && !isNaN(reset)) {
    const used = limit - remaining;
    if(elUsed) elUsed.textContent = used;
    if(elRemaining) elRemaining.textContent = remaining;
    if(elReset) {
      const resetDate = new Date(reset * 1000);
      elReset.textContent = resetDate.toLocaleTimeString() + ' (' + resetDate.toLocaleDateString() + ')';
    }
  }
}

async function apiCall(method, path, body) {
  const token = getToken();
  if(!token) throw new Error('请先输入并保存 Token');
  const url = `https://github.com{OWNER}/${REPO}/contents/${path}`;
  const options = {
    method,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    }
  };
  if(body) options.body = JSON.stringify(body);
  const res = await fetch(url, options);
  
  updateRateDisplay(res.headers);
  if (!res.ok && res.status !== 404) {
    const err = await res.json();
    throw new Error(err.message || 'API error');
  }
  return res;
}

// ---------- 获取仓库大小（已加上安全防錯）----------
async function fetchRepoSize() {
  const token = getToken();
  if (!token) return;
  try {
    const url = `https://github.com{OWNER}/${REPO}`;
    const res = await fetch(url, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    updateRateDisplay(res.headers);
    if (!res.ok) return;
    const data = await res.json();
    const sizeKB = data.size;
    const sizeMB = (sizeKB / 1024).toFixed(2);
    const elRepo = document.getElementById('repoSize');
    if(elRepo) elRepo.textContent = sizeMB + ' MB';
  } catch(e) {
    console.error('获取仓库大小失败', e);
  }
}

// ---------- 文件列表操作 ----------
async function listFiles() {
  const res = await apiCall('GET', FOLDER);
  if (res.status === 404) return [];
  const data = await res.json();
  if (!Array.isArray(data)) return [data];
  return data.filter(item => item.type === 'file');
}

async function refreshList() {
  const container = document.getElementById('fileList');
  if(!container) return;
  container.innerHTML = '加载中...';
  try {
    const files = await listFiles();
    if (files.length === 0) {
      container.innerHTML = '<div>暂无文件</div>';
      return;
    }

    container.innerHTML = '';
    for (const file of files) {
      const div = document.createElement('div');

      const link = document.createElement('a');
      link.href = file.download_url;
      link.target = '_blank';
      link.textContent = file.name;

      const actions = document.createElement('div');
      actions.style.display = 'flex';
      actions.style.gap = '8px';

      const dlBtn = document.createElement('a');
      dlBtn.href = file.download_url;
      dlBtn.setAttribute('download', file.name); 
      dlBtn.textContent = '下載';
      dlBtn.style.background = '#0969da';
      dlBtn.style.color = '#fff';
      dlBtn.style.padding = '6px 10px';
      dlBtn.style.borderRadius = '6px';
      dlBtn.style.fontSize = '14px';
      dlBtn.style.display = 'inline-block';

      const delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.textContent = '删除';
      delBtn.onclick = async () => {
        if (!confirm('确定删除?')) return;
        try {
          await deleteFile(file.path, file.sha);
          refreshList();
        } catch(err) {
          alert('删除失败: ' + err.message);
        }
      };

      actions.appendChild(dlBtn);
      actions.appendChild(delBtn);
      div.appendChild(link);
      div.appendChild(actions);
      container.appendChild(div);
    }
  } catch(e) {
    container.innerHTML = `<div style="color:red">错误: ${e.message}</div>`;
  }
}

// ---------- 上传文件 ----------
async function uploadFile() {
  const fileInput = document.getElementById('fileInput');
  const file = fileInput.files[0];
  if (!file) return alert('请选择文件');

  const maxBytes = MAX_FILE_SIZE_MB * 1024 * 1024;
  if (file.size > maxBytes) {
    alert(`文件过大！请选择小于 ${MAX_FILE_SIZE_MB} MB 的文件（当前文件约 ${(file.size / 1024 / 1024).toFixed(1)} MB）`);
    return;
  }

  const reader = new FileReader();
  reader.onload = async function(e) {
    const base64 = e.target.result.split(',')[1];
    const path = `${FOLDER}/${file.name}`;
    try {
      let sha = null;
      const checkRes = await apiCall('GET', path);
      if (checkRes.status === 200) {
        const data = await checkRes.json();
        sha = data.sha;
      }
      const body = {
        message: `Upload ${file.name}`,
        content: base64,
        branch: BRANCH,
        sha: sha
      };
      await apiCall('PUT', path, body);
      alert('上传成功');
      fileInput.value = '';
      refreshList();
      fetchRepoSize();
    } catch(err) {
      alert('上传失败: ' + err.message);
    }
  };
  reader.readAsDataURL(file);
}

// ---------- 删除文件 ----------
async function deleteFile(path, sha) {
  const body = { message: `Delete ${path}`, sha, branch: BRANCH };
  await apiCall('DELETE', path, body);
  fetchRepoSize(); 
}

// ---------- 初始化 (已加上安全防錯，若無標籤則不寫入) ----------
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('gh_token');
  if(saved) document.getElementById('tokenInput').value = saved;
  
  const elUsed = document.getElementById('apiUsed');
  const elRemaining = document.getElementById('apiRemaining');
  const elReset = document.getElementById('apiReset');
  
  if(elUsed) elUsed.textContent = '0';
  if(elRemaining) elRemaining.textContent = '5000';
  if(elReset) elReset.textContent = '待首次请求后更新';
  
  if (getToken()) {
    fetchRepoSize();
    refreshList();
  } else {
    document.getElementById('fileList').innerHTML = '<div>请先输入并保存 Token 以加载文件列表</div>';
    const elRepo = document.getElementById('repoSize');
    if(elRepo) elRepo.textContent = '未输入 Token';
  }
});
</script>
</body>
</html>
