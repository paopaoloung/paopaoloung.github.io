<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雲端暫存文本區</title>
<style>
body{font-family:Arial;margin:20px}
input,textarea{width:100%;box-sizing:border-box;padding:8px;margin:5px 0}
textarea{height:350px}
button{padding:8px 15px;margin:3px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;margin:5px 0}
a{text-decoration:none}
</style>
</head>
<body>

<h2>⛅泡泡龍-雲端暫存文本區⛅</h2>

Token-hRkyLmRfAAA：
<input id="token" value="github_pat_11A7UN⬛0pRoZgXVxrIA6_I6H3kmaI48xP8nX9HO6ssMpu4w43kX67yP1jHgPh5hUL32IG2TK3qZHi2fB">
<button onclick="saveToken()">保存Token</button>

<hr>

<p>檔案名稱：<input id="fileName" value="tmp.txt"> </p>
<textarea id="content"></textarea>

<button onclick="saveFile()">保存內容</button>
<button onclick="loadFiles()">刷新檔案列表</button>

<hr>

<h3>tmpTxt 檔案列表 (保存後約1-2min才會顯示)</h3>
<div id="files"></div>

<script>

const REPO="paopaoloung/paopaoloung.github.io";
const FOLDER="up/tmpTxt";

const token=document.getElementById("token");
const fileName=document.getElementById("fileName");
const content=document.getElementById("content");
const files=document.getElementById("files");


/* --
window.onload=()=>{
    token.value=localStorage.getItem("github_token")||"";
    loadFiles();
};

-- */
window.onload=()=>{
    token.value=
        localStorage.getItem("github_token")
        || token.value;

    loadFiles();
};


function saveToken(){
    localStorage.setItem("github_token",token.value.trim());
    alert("Token已保存");
}

function headers(){
    return{
        Authorization:`Bearer ${token.value.trim()}`,
        Accept:"application/vnd.github+json",
        "X-GitHub-Api-Version":"2022-11-28"
    };
}

function b64e(str){
    return btoa(unescape(encodeURIComponent(str)));
}

function b64d(str){
    return decodeURIComponent(escape(atob(str)));
}

async function saveFile(){

    if(!token.value.trim()){
        alert("請先輸入Token");
        return;
    }

    let sha=null;
    const path=`${FOLDER}/${fileName.value.trim()}`;

    const check=await fetch(
        `https://api.github.com/repos/${REPO}/contents/${path}`,
        {headers:headers()}
    );

    if(check.ok){
        sha=(await check.json()).sha;
    }

    const body={
        message:`save ${fileName.value.trim()}`,
        content:b64e(content.value)
    };

    if(sha) body.sha=sha;

const res=await fetch(
    `https://api.github.com/repos/${REPO}/contents/${path}`,
    {
        method:"PUT",
        headers:{...headers(),"Content-Type":"application/json"},
        body:JSON.stringify(body)
    }
);

    if(res.ok){
        alert("保存成功");
        fileName.value="tmp.txt";
        content.value="";
        setTimeout(loadFiles,5000);
    }else{
        alert(await res.text());
    }
}

async function loadFiles(){

    files.innerHTML="載入中...";

    const res=await fetch(
        `https://api.github.com/repos/${REPO}/contents/${FOLDER}`,
        {headers:headers()}
    );

    if(!res.ok){
        files.innerHTML="讀取失敗";
        return;
    }

    const list=await res.json();

    files.innerHTML="";

    list.filter(f=>f.type==="file"&&f.name!==".gitkeep")
        .sort((a,b)=>a.name.localeCompare(b.name))
        .forEach(f=>{

            const row=document.createElement("div");
            row.className="row";

            const link=document.createElement("a");
            link.href="#";
            link.textContent=f.name;
            link.onclick=e=>{
                e.preventDefault();
                openFile(f.name);
            };

            const del=document.createElement("button");
            del.textContent="刪除";
            del.onclick=()=>deleteFile(f.name);

            row.append(link,del);
            files.appendChild(row);
        });
}

async function openFile(name){

    const res=await fetch(
        `https://api.github.com/repos/${REPO}/contents/${FOLDER}/${name}`,
        {headers:headers()}
    );

    if(!res.ok){
        alert("讀取失敗");
        return;
    }

    const data=await res.json();

    fileName.value=name;
    content.value=b64d(data.content.replace(/\n/g,""));
}

async function deleteFile(name){

    if(!confirm(`刪除 ${name} ?`)) return;

    const info=await fetch(
        `https://api.github.com/repos/${REPO}/contents/${FOLDER}/${name}`,
        {headers:headers()}
    );

    const data=await info.json();

    const res=await fetch(
        `https://api.github.com/repos/${REPO}/contents/${FOLDER}/${name}`,
        {
            method:"DELETE",
            headers:{...headers(),"Content-Type":"application/json"},
            body:JSON.stringify({
                message:`delete ${name}`,
                sha:data.sha
            })
        }
    );

    if(res.ok){
        loadFiles();
    }else{
        alert("刪除失敗");
    }
}

</script>
</body>
</html>
