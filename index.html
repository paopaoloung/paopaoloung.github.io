<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Text Demo</title>
</head>
<body style="margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: #1a1a1a; font-family: Arial, sans-serif; overflow: hidden;">

    <span style="padding: 20px 40px; font-size: 28px; font-weight: bold; color: #fff; background: linear-gradient(45deg, #ffd700, #ffa500); border-radius: 50px; cursor: pointer; box-shadow: 0 10px 20px rgba(255, 215, 0, 0.4); transition: transform 0.1s, box-shadow 0.1s; display: inline-block;" 
          onmousedown="this.style.transform='scale(0.95)'; this.style.box-shadow='0 5px 10px rgba(255,215,0,0.2)';" 
          onmouseup="this.style.transform='none'; this.style.box-shadow='0 10px 20px rgba(255,215,0,0.4)';"
          onmouseleave="this.style.transform='none'; this.style.box-shadow='0 10px 20px rgba(255,215,0,0.4)';">
        璀璨奢華
    </span>

</body>
</html>
