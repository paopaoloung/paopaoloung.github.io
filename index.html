<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金幣多多</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .gold-btn {
            padding: 20px 40px;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ffd700, #ffa500);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .gold-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(255, 215, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- 按鈕本體 -->
    <button class="gold-btn" onclick="playCoinSound()">💰 金幣多多</button>

    <!-- 內嵌的爆金幣音效 (使用免版權的網路音效網址，你也可以換成自己的 MP3 連結) -->
    <audio id="coin-sound" src="https://mixkit.co" preload="auto"></audio>

    <script>
        function playCoinSound() {
            const sound = document.getElementById('coin-sound');
            sound.currentTime = 0; // 每次點擊都重頭播放，實現連續狂點效果
            sound.play().catch(error => {
                console.log("瀏覽器阻擋自動播放，需等使用者互動：", error);
            });
        }
    </script>

</body>
</html>
