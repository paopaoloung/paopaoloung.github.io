<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大富翁銀行後台控制</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            width: 100%;
            margin-top: 10px;
        }
        .btn-danger { background-color: #ff4d4d; color: white; }
        .btn-success { background-color: #4caf50; color: white; }
        input {
            padding: 10px;
            font-size: 16px;
            width: 90%;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            text-align: center;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>🎲 大富翁控制台</h2>

    <!-- 功能 1：重置所有玩家 -->
    <div class="card">
        <h3>全體資金重置</h3>
        <p>將所有玩家金額設為 1,500,000 並清空現金池。</p>
        <button class="btn-danger" id="resetBtn">一鍵重置所有人</button>
    </div>

    <!-- 功能 2：修改現金池 (直接覆蓋) -->
    <div class="card">
        <h3>管理現金池</h3>
        <p>輸入金額以「直接覆蓋」目前的現金池：</p>
        <input type="number" id="poolAmount" placeholder="例如：2000000" min="0">
        <button class="btn-success" id="addPoolBtn">確認重設金額</button>
    </div>

    <!-- 訊息提示區 -->
    <div id="status">準備就緒</div>

    <script>
        // 🔗 請將下方網址替換為你最新的 Google Apps Script 巨集網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzECqgHA8h_XNDmnZVeyTRuixgGbKYQKYg09s1xkOyntDEvZxow-HUrtXn8XnpaOUKf/exec";

        const statusDiv = document.getElementById("status");

        // --- 功能 1：重置玩家事件 ---
        document.getElementById("resetBtn").addEventListener("click", function() {
            if (!confirm("確定要重置所有人的資金為 1,500,000 嗎？此操作不可逆！")) return;

            showStatus("正在重置中...", "#ffa500");
            
            fetch(`${GAS_URL}?action=reset_players`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        showStatus("✅ " + data.message, "#4caf50");
                    } else {
                        showStatus("❌ 重置失敗", "#ff4d4d");
                    }
                })
                .catch(err => {
                    console.error(err);
                    showStatus("❌ 網路連線錯誤", "#ff4d4d");
                });
        });

        // --- 功能 2：覆蓋現金池事件 ---
        document.getElementById("addPoolBtn").addEventListener("click", function() {
            const amountInput = document.getElementById("poolAmount");
            const amount = parseInt(amountInput.value);

            if (isNaN(amount) || amount < 0) {
                alert("請輸入有效的金額！");
                return;
            }

            showStatus("正在更新現金池...", "#ffa500");

            fetch(`${GAS_URL}?action=set_pool&amount=${amount}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        showStatus(`✅ 現金池已成功重設為：${data.pool_cash}`, "#4caf50");
                        amountInput.value = ""; // 成功後清空輸入框
                    } else {
                        showStatus("❌ 更新現金池失敗", "#ff4d4d");
                    }
                })
                .catch(err => {
                    console.error(err);
                    showStatus("❌ 網路連線錯誤", "#ff4d4d");
                });
        });

        // 輔助函式：顯示狀態
        function showStatus(text, color) {
            statusDiv.innerText = text;
            statusDiv.style.color = color;
        }
    </script>
</body>
</html>
